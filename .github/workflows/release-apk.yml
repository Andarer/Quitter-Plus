name: Build and Release Android APK (Android 5.0+)

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Версия релиза (например, v1.2.0)'
        required: false
        default: 'v1.2.0'

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK (minSdk 21 / Android 5.0+) & Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build Web Application
        run: npm run build

      - name: Sync Web Assets to Android Platform
        run: |
          npx cap sync android

      - name: Build Android APK with Gradle
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace || ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Locate and Prepare Output APK
        id: prepare_apk
        run: |
          mkdir -p release_output
          APK_FILE=$(find android/app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "❌ Ошибка: APK файл не найден в android/app/build/outputs/apk!"
            exit 1
          fi
          echo "✅ Найден скомпилированный APK: $APK_FILE"
          
          VERSION_TAG="${{ github.ref_name }}"
          if [ -z "$VERSION_TAG" ] || [ "$VERSION_TAG" = "main" ] || [ "$VERSION_TAG" = "master" ]; then
            VERSION_TAG="${{ github.event.inputs.release_version || 'v1.2.0' }}"
          fi
          
          OUTPUT_APK="release_output/QuitterPlus-${VERSION_TAG}-android5.0+.apk"
          cp "$APK_FILE" "$OUTPUT_APK"
          echo "apk_path=$OUTPUT_APK" >> $GITHUB_OUTPUT
          echo "version_tag=$VERSION_TAG" >> $GITHUB_OUTPUT
          ls -lh release_output/

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: QuitterPlus-Android5-Release-APK
          path: ${{ steps.prepare_apk.outputs.apk_path }}
          retention-days: 30

      - name: Generate Changelog from Commits
        id: changelog
        run: |
          VERSION="${{ steps.prepare_apk.outputs.version_tag }}"
          echo "## 🚀 Quitter Plus ${VERSION}" > release_notes.md
          echo "" >> release_notes.md
          echo "**Платформа:** Android 5.0+ (Lollipop / API 21+) и новее" >> release_notes.md
          echo "**Автор:** Andárer" >> release_notes.md
          echo "" >> release_notes.md
          echo "### 📦 Что нового в этом релизе:" >> release_notes.md
          echo "" >> release_notes.md
          
          git log -n 25 --pretty=format:"* %s (%h)" >> release_notes.md || echo "* Первоначальный стабильный релиз" >> release_notes.md
          
          echo "" >> release_notes.md
          echo "---" >> release_notes.md
          echo "### 📲 Инструкция по установке:" >> release_notes.md
          echo "1. Скачайте файл \`QuitterPlus-${VERSION}-android5.0+.apk\` ниже в блоке Assets." >> release_notes.md
          echo "2. На Android разрешите установку из этого источника." >> release_notes.md
          echo "3. Откройте файл для установки." >> release_notes.md

      - name: Publish GitHub Release with Ready APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ steps.prepare_apk.outputs.version_tag }}
          name: Quitter Plus ${{ steps.prepare_apk.outputs.version_tag }} (Android 5.0+)
          body_path: release_notes.md
          files: ${{ steps.prepare_apk.outputs.apk_path }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
