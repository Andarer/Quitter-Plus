name: Build and Release Android APK (Android 5.0+)

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Версия релиза (например, v1.2.0)'
        required: false
        default: 'v1.2.0'

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK (minSdk 21 / Android 5.0+) & Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build Web Application
        run: npm run build

      - name: Install Capacitor CLI & Android
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Initialize Capacitor for Android 5.0+ (API 21+)
        run: |
          npx cap init "Quitter Plus" "com.andarer.quitterplus" --web-dir dist || true
          npx cap add android || true
          
          # Force minSdkVersion 21 (Android 5.0 Lollipop) in variables.gradle
          if [ -f android/variables.gradle ]; then
            sed -i 's/minSdkVersion = [0-9]*/minSdkVersion = 21/g' android/variables.gradle || true
          fi
          
          npx cap sync android

      - name: Build Android APK with Gradle
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease || ./gradlew assembleDebug

      - name: Locate and Rename Output APK
        id: prepare_apk
        run: |
          RAW_APK=$(find android/app/build/outputs/apk -name "*.apk" | head -n 1)
          echo "Found raw APK at: $RAW_APK"
          VERSION_TAG="${{ github.ref_name }}"
          if [ -z "$VERSION_TAG" ] || [ "$VERSION_TAG" = "main" ] || [ "$VERSION_TAG" = "master" ]; then
            VERSION_TAG="${{ github.event.inputs.release_version || 'v1.2.0' }}"
          fi
          FINAL_APK_NAME="QuitterPlus-${VERSION_TAG}-android5.0+.apk"
          cp "$RAW_APK" "./$FINAL_APK_NAME"
          echo "apk_path=./$FINAL_APK_NAME" >> $GITHUB_OUTPUT
          echo "version_tag=$VERSION_TAG" >> $GITHUB_OUTPUT

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: QuitterPlus-Android5-Release-APK
          path: ${{ steps.prepare_apk.outputs.apk_path }}
          retention-days: 30

      - name: Generate Changelog from Commits
        id: changelog
        run: |
          VERSION="${{ steps.prepare_apk.outputs.version_tag }}"
          echo "## 🚀 Quitter Plus ${VERSION}" > release_notes.md
          echo "" >> release_notes.md
          echo "**Платформа:** Android 5.0+ (Lollipop / API 21+) и новее" >> release_notes.md
          echo "**Автор:** Andárer" >> release_notes.md
          echo "" >> release_notes.md
          echo "### 📦 Что нового в этом релизе:" >> release_notes.md
          echo "" >> release_notes.md
          
          # Parse conventional commits
          git log -n 25 --pretty=format:"* %s (%h)" >> release_notes.md || echo "* Первоначальный стабильный релиз" >> release_notes.md
          
          echo "" >> release_notes.md
          echo "---" >> release_notes.md
          echo "### 📲 Инструкция по установке:" >> release_notes.md
          echo "1. Скачайте файл \`${{ steps.prepare_apk.outputs.apk_path }}\` ниже в разделе Assets." >> release_notes.md
          echo "2. На Android разрешите установку из неизвестных источников при запросе." >> release_notes.md
          echo "3. Откройте файл и нажмите «Установить»." >> release_notes.md

      - name: Publish GitHub Release with Ready APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ steps.prepare_apk.outputs.version_tag }}
          name: Quitter Plus ${{ steps.prepare_apk.outputs.version_tag }} (Android 5.0+)
          body_path: release_notes.md
          files: ${{ steps.prepare_apk.outputs.apk_path }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
