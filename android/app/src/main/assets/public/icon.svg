<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="qbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <linearGradient id="qglow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Circle with Safe Zone -->
  <rect width="512" height="512" rx="128" fill="url(#qbg)"/>
  
  <!-- Subtle geometric shield ring -->
  <circle cx="256" cy="256" r="180" stroke="url(#qglow)" stroke-width="8" stroke-dasharray="16 12" opacity="0.4"/>
  
  <!-- Modern Freedom Leaf & Broken Chain Motif -->
  <g filter="url(#glow)">
    <!-- Upward soaring sprout / Phoenix flame of renewal -->
    <path d="M256 110 C210 170 170 230 170 300 C170 360 210 400 256 400 C302 400 342 360 342 300 C342 230 302 170 256 110 Z" fill="url(#qglow)" opacity="0.95"/>
    <path d="M256 110 C270 200 310 260 256 360 C250 260 240 200 256 110 Z" fill="#ffffff" opacity="0.35"/>
    
    <!-- Breaking links spark -->
    <circle cx="256" cy="240" r="14" fill="#ffffff" />
    <path d="M190 260 L140 240 M322 260 L372 240" stroke="#34d399" stroke-width="10" stroke-linecap="round" />
  </g>
</svg>
