# git-cliff configuration for Conventional Commits
# https://git-cliff.org/docs/configuration

[changelog]
header = """
# Changelog\n
Все важные изменения проекта документируются в этом файле.\n
"""
body = """
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | upper_first }}
    {% for commit in commits %}
        - {% if commit.scope %}*({{ commit.scope }})* {% endif %}{{ commit.message | upper_first }}\
    {% endfor %}
{% endfor %}\n
"""
trim = true
footer = """
<!-- generated by git-cliff -->
"""

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
commit_parsers = [
    { message = "^feat", group = "Добавлено (Features)" },
    { message = "^fix", group = "Исправлено (Bug Fixes)" },
    { message = "^perf", group = "Оптимизация (Performance)" },
    { message = "^docs", group = "Документация (Documentation)" },
    { message = "^ci", group = "CI/CD & Сборка (Pipelines)" },
    { message = "^refactor", group = "Рефакторинг (Refactor)" },
    { message = "^style", group = "Стили (Styles)" },
    { message = "^chore\\(release\\)", skip = true },
    { message = "^chore", group = "Обслуживание (Maintenance)" },
]
filter_commits = false
tag_pattern = "v[0-9].*"
sort_commits = "oldest"
